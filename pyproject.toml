[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statement-ingestion-pipeline"
version = "0.4.1"
description = "Local-first credit card statement ingestion, classification, and finance ledger"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pdfplumber>=0.11",
  "pandas>=2.2",
  "duckdb>=1.1",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.0",
  "ollama>=0.4",
  "pyarrow>=18.0",
  "openpyxl>=3.1",
  "httpx>=0.27",
  "rapidfuzz>=3.9",
  "filelock>=3.15",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pywebview>=5.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
package = ["pyinstaller>=6.11"]

[project.scripts]
fin = "src.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Ordered classification rules. First match wins.
# AI suggestions never write here — only human-confirmed review entries do.

categories:
  - Housing
  - Utilities
  - Food
  - Travel
  - Entertainment
  - Shopping
  - Health
  - Transport
  - Subscriptions
  - Personal
  - Transfers
  - Fees
  - Income
  - Taxes
  - Uncategorized

# Managed vocabulary of subcategories per primary. Keep strings consistent.
subcategories:
  Housing:
    - Mortgage
    - HOA
  Utilities:
    - Electric
    - InternetPhone
    - NaturalGas
  Food:
    - FastFood
    - Groceries
    - Restaurant
    - Coffee
  Travel:
    - Lodging
    - Transit
  Entertainment: []
  Shopping:
    - Retail
    - Warehouse
  Health: []
  Transport:
    - Gas
    - Rideshare
  Subscriptions:
    - Streaming
    - Fitness
  Personal: []
  Transfers:
    - CardPayment
    - Monthly Payment
    - InternalTransfer
  Fees:
    - CardFee
  Income:
    - Payroll
    - Interest
  Taxes: []
  Uncategorized: []

rules:
  - match:
      merchant_regex: "(?i)chick[- ]?fil[- ]?a|mcdonald'?s|wendy'?s|taco bell|chipotle|starbucks|dunkin"
    category: Food
    subcategory: FastFood

  - match:
      merchant_regex: "(?i)\\b(uber|lyft)\\b"
    category: Transport
    subcategory: Rideshare

  - match:
      merchant_regex: "(?i)shell|exxon|chevron|bp\\b|circle k|speedway|costco gas|love'?s|loves\\b|sheetz|quik\\s?trip|\\bqt\\b|wawa|racetrac(?:k)?|pilot\\b|flying j|murphy express|casey'?s|kum\\s?&\\s?go"
    category: Transport
    subcategory: Gas

  - match:
      merchant_regex: "(?i)netflix|spotify|hulu|disney\\+|apple\\.com/bill|youtube premium|amazon prime"
    category: Subscriptions
    subcategory: Streaming

  - match:
      merchant_regex: "(?i)amazon\\.com|amzn|walmart|target|costco"
    category: Shopping
    subcategory: Retail

  - match:
      merchant_regex: "(?i)duke energy|dominion|pg&e|coned|florida power|fpl|georgia power"
    category: Utilities
    subcategory: Electric

  - match:
      merchant_regex: "(?i)comcast|xfinity|verizon|at&t|t-mobile|spectrum"
    category: Utilities
    subcategory: InternetPhone

  - match:
      merchant_regex: "(?i)mortgage|wells fargo home|rocket mortgage|quicken loans|pennymac"
    category: Housing
    subcategory: Mortgage

  - match:
      merchant_regex: "(?i)payment thank you|mobile payment|autopay|online payment|credit card payment|payment received|web payment"
    category: Transfers
    subcategory: Monthly Payment

  - match:
      merchant_regex: "(?i)interest charge|late fee|annual fee|foreign transaction fee"
    category: Fees
    subcategory: CardFee

  - match:
      merchant_regex: "(?i)american express ach|\\bach pmt\\b|ach payment"
    category: Transfers
    subcategory: CardPayment

  - match:
      merchant_regex: "(?i)online transfer to .*(checking|savings)|internal transfer"
    category: Transfers
    subcategory: InternalTransfer

  - match:
      merchant_regex: "(?i)\\bpayroll\\b"
    category: Income
    subcategory: Payroll

  - match:
      merchant_regex: "(?i)\\bhoa\\b"
    category: Housing
    subcategory: HOA

  - match:
      merchant_regex: "(?i)^interest payment$|\\binterest payment\\b"
    category: Income
    subcategory: Interest
